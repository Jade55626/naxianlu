<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>納賢錄｜抽卡紀錄</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>📜 納賢錄</h1>
  <p>抽卡紀錄簿</p>
</header>

<main>

  <section class="card">
    <h2>抽卡統計</h2>

    <div class="stats">
      <div>
        <strong id="totalDraws">0</strong>
        <span>總抽數</span>
      </div>

      <div>
        <strong id="rareCount">0</strong>
        <span>總出金</span>
      </div>

      <div>
        <strong id="averageDraws">0</strong>
        <span>平均出金</span>
      </div>
    </div>
  </section>


  <section class="card">
    <h2>✦ 新增抽卡紀錄</h2>

    <label>
      卡池
      <select id="pool">
        <option value="普池">普池</option>
        <option value="限定池">限定池</option>
      </select>
    </label>

    <label>
      角色名稱
      <input id="character" type="text" placeholder="例如：楊修">
    </label>

    <label>
      本次抽數
      <input id="draws" type="number" min="1" placeholder="例如：35">
    </label>

    <label class="checkbox">
      <input id="isUp" type="checkbox">
      UP角色
    </label>

    <button onclick="addRecord()">記錄此次招募</button>
  </section>


  <section class="card">
    <h2>📊 卡池統計</h2>

    <div id="poolStats">
      <p class="empty">目前還沒有抽卡紀錄。</p>
    </div>
  </section>


  <section class="card">
    <h2>📖 招募紀錄</h2>

    <div id="records">
      <p class="empty">目前還沒有抽卡紀錄。</p>
    </div>

    <button class="danger" onclick="clearRecords()">
      清除全部紀錄
    </button>
  </section>

</main>

<script src="script.js"></script>

</body>
</html>
